name: Build and release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build FitNex APK
    runs-on: ubuntu-latest

    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew test --console=plain

      - name: Build APK
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "Signing with the shared release keystore."
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/fitnex-release.jks"
            export FITNEX_KEYSTORE_FILE="$RUNNER_TEMP/fitnex-release.jks"
            export FITNEX_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD"
            export FITNEX_KEY_ALIAS="$KEY_ALIAS"
            export FITNEX_KEY_PASSWORD="$KEY_PASSWORD"
            ./gradlew assembleRelease --console=plain
            SRC="app/build/outputs/apk/release/app-release.apk"
          else
            echo "::warning::No signing secrets configured - falling back to a debug-signed APK."
            ./gradlew assembleDebug --console=plain
            SRC="app/build/outputs/apk/debug/app-debug.apk"
          fi
          [ -f "$SRC" ] || { echo "APK not found at $SRC"; exit 1; }
          echo "APK_SRC=$SRC" >> "$GITHUB_ENV"

      - name: Name the APK after the version
        id: version
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          case "$VERSION" in
            ""|main|master) VERSION="$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -n1)" ;;
          esac
          APK="FitNEX-${VERSION}.apk"
          cp "$APK_SRC" "$APK"
          echo "Built $APK from $APK_SRC"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Extract release notes from CHANGELOG
        run: |
          set -euo pipefail
          awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            printf 'FitNEX %s\n' "$VERSION" > release_notes.md
          fi
          cat release_notes.md

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: FitNEX-${{ env.VERSION }}-apk
          path: ${{ env.APK }}
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: FitNEX ${{ env.VERSION }}
          body_path: release_notes.md
          files: ${{ env.APK }}
          fail_on_unmatched_files: true
